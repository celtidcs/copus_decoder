[package]
name = "copus_decoder"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Decodificador Opus en Rust puro (sin unsafe ni FFI): copia corregida y auditada de opus-decoder 0.1.1"
license = "GPL-3.0-or-later"
repository = "https://github.com/celtidcs/copus_decoder"
readme = "README.md"
keywords = ["opus", "audio", "codec", "decoder", "rfc8251"]
categories = ["multimedia::audio"]
publish = false

[lib]
name = "copus_decoder"
path = "src/lib.rs"

[dependencies]
thiserror = "2.0.18"
